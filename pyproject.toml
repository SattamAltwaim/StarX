[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starx"
version = "0.1.0"
description = "StarX baseline: 3D reconstruction of mechanical parts from CAD sketches via TripoSR + LoRA"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Informational only - Colab notebooks install from starx.pins.PIP_PINS instead,
# and the package itself is used via sys.path (never pip-installed).
dev = [
    "pytest",
    "torch",
    "trimesh",
    "scipy",
    "scikit-image",
    "matplotlib",
    "pandas",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["starx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
